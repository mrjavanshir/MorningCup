name = "ganira-games-store"
main = "src/index.js"
compatibility_date = "2026-08-19"

# Origins allowed to call this Worker. Any localhost port is also accepted, so
# `npm run dev` works whichever port Vite lands on — see isLocalhost in index.js.
[vars]
ALLOWED_ORIGINS = "https://mrjavanshir.github.io"

# Replace `id` with the real namespace id printed by:
#   npx wrangler kv namespace create STORE
[[kv_namespaces]]
binding = "STORE"
id = "08418d178e70467c998c321bfe5dcf2a"
