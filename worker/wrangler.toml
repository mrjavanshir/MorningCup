name = "ganira-games-store"
main = "src/index.js"
compatibility_date = "2026-08-19"

# Origins allowed to call this Worker. Local dev is included so `npm run dev`
# can talk to `wrangler dev` without editing anything.
[vars]
ALLOWED_ORIGINS = "https://mrjavanshir.github.io,http://localhost:5173,http://localhost:5210,http://localhost:5211,http://localhost:5212,http://localhost:5213"

# Replace `id` with the real namespace id printed by:
#   npx wrangler kv namespace create STORE
[[kv_namespaces]]
binding = "STORE"
id = "08418d178e70467c998c321bfe5dcf2a"
